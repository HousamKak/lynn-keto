<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#2F6B5A" />
<title>Lynn's Plan</title>
<link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="styles.css?v=20" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<style>
  /* Inline: hide app content until the password is entered (prevents flash) */
  html, body { margin: 0; padding: 0; }
  body.locked > header, body.locked > nav, body.locked > main { display: none !important; }
  body.locked > .gate-overlay { display: flex !important; }
  body.locked { background: #1F4D41; overflow: hidden; height: 100vh; height: 100dvh; }
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
</head>
<body class="locked">

<div class="gate-overlay" id="gateOverlay">
  <div class="gate-card">
    <div class="gate-icon" id="gateIcon"></div>
    <h2 class="gate-title">Lynn's Plan</h2>
    <p class="gate-sub">Enter password to continue</p>
    <label for="gateInput" class="sr-only">Password</label>
    <input type="password" id="gateInput" placeholder="••••••" autocomplete="off" />
    <button class="btn btn-primary" id="gateSubmit">Unlock</button>
    <p class="gate-error" id="gateError" role="alert" aria-live="assertive"></p>
  </div>
</div>

<header>
  <button class="lang-toggle" id="langToggle" aria-label="Switch language">عربي</button>
  <h1 data-i18n="appTitle">Lynn's Plan</h1>
  <div class="sub" data-i18n="appSub"></div>
  <div class="week-badge" id="weekBadge"></div>
</header>

<nav class="tabs" id="tabs" role="tablist" aria-label="App sections">
  <button class="tab active" data-tab="today" data-icon="home" data-i18n="tab_today"></button>
  <button class="tab" data-tab="plan" data-icon="clipboard" data-i18n="tab_plan"></button>
  <button class="tab" data-tab="swaps" data-icon="swap" data-i18n="tab_swaps"></button>
  <button class="tab" data-tab="shop" data-icon="bag" data-i18n="tab_shop"></button>
  <button class="tab" data-tab="move" data-icon="dumbbell" data-i18n="tab_move"></button>
  <button class="tab" data-tab="progress" data-icon="chartLine" data-i18n="tab_progress"></button>
  <button class="tab" data-tab="calendar" data-icon="calendar" data-i18n="tab_calendar"></button>
  <button class="tab" data-tab="guide" data-icon="book" data-i18n="tab_guide"></button>
  <button class="tab" data-tab="settings" data-icon="settings" data-i18n="tab_settings"></button>
</nav>

<main>

<!-- TODAY -->
<section id="today" class="active">
  <div class="card day-head">
    <div class="date-nav">
      <button class="icon-btn" id="prevDay" aria-label="Previous day"></button>
      <div class="date-nav-mid">
        <div class="date-weekday" id="dayWeekday"></div>
        <div class="date-full" id="dayDate"></div>
      </div>
      <button class="icon-btn" id="nextDay" aria-label="Next day"></button>
    </div>
    <div class="past-banner" id="pastBanner" hidden>
      <span data-i18n="past_day"></span>
      <button class="btn btn-sm btn-secondary" id="backToday" data-i18n="back_today"></button>
    </div>
    <div class="score-row">
      <div class="ring" id="scoreRing"><svg viewBox="0 0 36 36"><circle class="ring-bg" cx="18" cy="18" r="15.9"/><circle class="ring-fg" id="ringFg" cx="18" cy="18" r="15.9"/></svg><span id="scoreNum">0</span></div>
      <div>
        <div class="score-title" id="scoreTitle"></div>
        <div class="score-sub" id="streakText"></div>
      </div>
    </div>
    <div class="checklist" id="checklist"></div>
  </div>

  <div class="card prep-card" id="todayPrep" hidden></div>

  <div class="card">
    <h3 id="mealsHeader"></h3>
    <div id="todayMeals" class="meal-list"></div>
  </div>

  <div class="card">
    <div class="card-head">
      <h3 data-i18n="water"></h3>
      <span class="pill" id="waterLabel"></span>
    </div>
    <p class="hint" data-i18n="water_sub"></p>
    <div class="water-row" id="waterRow"></div>
  </div>

  <div class="card">
    <h3 data-i18n="habits"></h3>
    <div class="habits" id="habits"></div>
  </div>

  <div class="card">
    <h3 data-i18n="nutrition"></h3>
    <div id="nutritionBars"></div>
    <div id="nutritionMsg"></div>
    <p class="hint" data-i18n="nutrition_hint"></p>
    <h4 data-i18n="extras"></h4>
    <p class="hint" id="extraNote"></p>
    <div class="inline-form">
      <select id="extraSelect" aria-label="Extra portion"></select>
      <button class="btn btn-primary" id="extraAdd" data-i18n="add"></button>
    </div>
    <div id="extrasList"></div>
  </div>
</section>

<!-- PLAN -->
<section id="plan">
  <div class="card">
    <h2 data-i18n="plan_title"></h2>
    <div class="chips" id="planDays" role="tablist"></div>
    <p class="hint" id="portionRules"></p>
  </div>
  <div id="planMeals"></div>
  <div class="card">
    <h3 data-i18n="day_total"></h3>
    <div id="planTotals"></div>
    <div class="note" id="planNote"></div>
  </div>
</section>

<!-- SWAPS -->
<section id="swaps">
  <div class="card">
    <h2 data-i18n="swaps_title"></h2>
    <p class="hint" data-i18n="swaps_sub"></p>
  </div>
  <div id="swapGroups"></div>
</section>

<!-- SHOP & PREP -->
<section id="shop">
  <div class="card">
    <div class="card-head">
      <h2 data-i18n="grocery_title"></h2>
    </div>
    <div class="progress-line"><div class="fill" id="groceryFill"></div></div>
    <p class="hint" id="groceryCount"></p>
    <div id="groceryList"></div>
    <button class="btn btn-secondary btn-block" id="groceryReset" data-i18n="new_week"></button>
  </div>
  <div class="card">
    <h2 data-i18n="prep_title"></h2>
    <div id="prepLists"></div>
    <div class="note" id="prepNote"></div>
  </div>
</section>

<!-- MOVE -->
<section id="move">
  <div class="card">
    <h2 data-i18n="move_title"></h2>
    <div class="workout-name" id="workoutName"></div>
    <a class="btn btn-secondary btn-block" id="workoutLink" target="_blank" rel="noopener" data-i18n="open_video"></a>
    <div class="week-strip" id="weekStrip"></div>
    <p class="score-sub" id="weekCount"></p>
    <ul class="bullets" id="workoutNotes"></ul>
  </div>
</section>

<!-- PROGRESS -->
<section id="progress">
  <div class="card">
    <h2 data-i18n="progress_title"></h2>
    <div class="stats" id="progressStats"></div>
    <p class="hint" data-i18n="progress_body_note"></p>
  </div>
  <div class="card">
    <h3 data-i18n="weight"></h3>
    <div class="inline-form">
      <input type="date" id="weightDate" aria-label="Date" />
      <input type="number" id="weightInput" step="0.1" min="30" max="200" inputmode="decimal" data-i18n-placeholder="log_weight" />
      <button class="btn btn-primary" id="addWeight" data-i18n="add"></button>
    </div>
    <div class="chart-wrap"><canvas id="weightChart"></canvas></div>
    <div id="weightEntries"></div>
  </div>
  <div class="card">
    <h3 data-i18n="waist"></h3>
    <p class="hint" id="waistNote"></p>
    <div class="inline-form">
      <input type="date" id="waistDate" aria-label="Date" />
      <input type="number" id="waistInput" step="0.5" min="40" max="200" inputmode="decimal" data-i18n-placeholder="log_waist" />
      <button class="btn btn-primary" id="addWaist" data-i18n="add"></button>
    </div>
    <div class="chart-wrap"><canvas id="waistChart"></canvas></div>
    <div id="waistEntries"></div>
  </div>
</section>

<!-- CALENDAR -->
<section id="calendar">
  <div class="card">
    <div class="date-nav">
      <button class="icon-btn" id="prevMonth" aria-label="Previous month"></button>
      <div class="date-nav-mid"><div class="date-weekday" id="monthLabel"></div></div>
      <button class="icon-btn" id="nextMonth" aria-label="Next month"></button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <p class="hint" data-i18n="cal_legend"></p>
  </div>
</section>

<!-- GUIDE -->
<section id="guide">
  <div class="card">
    <h3 data-i18n="guide_goal"></h3>
    <p id="guideGoal" class="lead"></p>
    <h3 data-i18n="guide_details"></h3>
    <div class="stats" id="guideDetails"></div>
  </div>
  <div class="card">
    <h3 data-i18n="guide_targets"></h3>
    <div id="guideTargets"></div>
    <p class="hint" id="targetsNote"></p>
    <h4 data-i18n="daily_structure"></h4>
    <div id="guideStructure"></div>
  </div>
  <div class="card">
    <h3 data-i18n="guide_rules"></h3>
    <ul class="bullets" id="guideRules"></ul>
    <div class="note" id="metforminNote"></div>
  </div>
  <div class="card">
    <h3 data-i18n="guide_portions"></h3>
    <p id="guidePortions"></p>
    <h3 data-i18n="guide_progress"></h3>
    <p id="guideProgress"></p>
  </div>
</section>

<!-- SETTINGS -->
<section id="settings">
  <div class="card">
    <h2 data-i18n="settings_title"></h2>
    <h3 data-i18n="start_date"></h3>
    <div class="inline-form">
      <input type="date" id="startDateInput" aria-label="Start date" />
      <button class="btn btn-primary" id="saveStart" data-i18n="save"></button>
    </div>
    <h3 data-i18n="profile"></h3>
    <div class="form-grid">
      <label><span data-i18n="age"></span><input type="number" id="pAge" min="10" max="99" /></label>
      <label><span data-i18n="height"></span><input type="number" id="pHeight" min="100" max="230" /></label>
      <label><span data-i18n="start_weight"></span><input type="number" id="pWeight" step="0.1" min="30" max="200" /></label>
    </div>
    <button class="btn btn-primary btn-block" id="saveProfile" data-i18n="save"></button>
  </div>
  <div class="card">
    <h3 data-i18n="labels_title"></h3>
    <p class="hint" data-i18n="labels_sub"></p>
    <div id="labelForms"></div>
    <div class="btn-row">
      <button class="btn btn-primary" id="saveLabels" data-i18n="save"></button>
      <button class="btn btn-secondary" id="resetLabels" data-i18n="reset_labels"></button>
    </div>
  </div>
  <div class="card">
    <h3 data-i18n="backup"></h3>
    <div class="btn-row">
      <button class="btn btn-primary" id="exportData" data-i18n="export"></button>
      <label class="btn btn-secondary"><span data-i18n="import"></span><input type="file" id="importData" accept=".json,application/json" hidden /></label>
    </div>
    <h3 class="danger-title" data-i18n="danger"></h3>
    <button class="btn btn-danger" id="resetAll" data-i18n="reset_all"></button>
  </div>
</section>

</main>

<div id="toastHost" role="region" aria-live="polite" aria-label="Notifications"></div>
<div id="confettiHost" aria-hidden="true"></div>

<script src="data.js?v=20"></script>
<script src="icons.js?v=20"></script>
<script src="gate.js?v=20"></script>
<script src="app.js?v=20"></script>
</body>
</html>
